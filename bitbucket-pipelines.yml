image: docker:latest

x-step-common: &step-common
  image: docker:latest
  size: 2x
  services:
    - docker-large
  caches:
    - docker
  variables:
    DOCKER_REGISTRY: ghcr.io/awide-labs

x-step-package: &step-package
  image: docker:latest
  size: 2x
  services:
    - docker-large
  caches:
    - docker
  variables:
    DOCKER_REGISTRY: ghcr.io/awide-labs

x-prepare-builder: &prepare-builder |
  apk add --no-cache git
  git submodule update --init --recursive
  export DOCKER_REGISTRY="${DOCKER_REGISTRY:-ghcr.io/awide-labs}"
  DOCKER_LOGIN_HOST="${DOCKER_REGISTRY%%/*}"
  if [ -n "$API_TOKEN" ] && [ -n "$DOCKER_USER" ]; then
    echo "$API_TOKEN" | docker login "$DOCKER_LOGIN_HOST" --username "$DOCKER_USER" --password-stdin
  fi
  echo "Pulling builder image from registry..."
  docker pull "${DOCKER_REGISTRY}/pfs-build-${BUILDER_IMAGE}" || {
    echo "Error: Builder image not found in registry. Run build-docker-images first."
    exit 1
  }
  docker tag "${DOCKER_REGISTRY}/pfs-build-${BUILDER_IMAGE}" "$BUILDER_IMAGE"

x-build-script: &build-script |
  docker run --rm \
    -v $(pwd):/polarfs \
    -w /polarfs \
    "$BUILDER_IMAGE" \
    bash -lc './autobuild.sh && ./.ci/report_binary_sizes.sh'

x-package-script: &package-script |
  docker run --rm \
    -v $(pwd):/polarfs \
    -w /polarfs \
    "$BUILDER_IMAGE" \
    ./.ci/ci-package.sh

definitions:
  services:
    docker:
      memory: 3072
    docker-large:
      type: docker
      memory: 7128
  steps:
    # Lint steps (minimal resources, no docker service needed)
    - step: &check-commit-format
        name: Check Commit Format
        image: atlassian/default-image:3
        size: 1x
        script:
          - git fetch origin ${BITBUCKET_PR_DESTINATION_BRANCH}
          - .ci/check_commit_format.sh origin/${BITBUCKET_PR_DESTINATION_BRANCH}

    - step: &check-changelog
        name: Check Changelog
        image: atlassian/default-image:3
        size: 1x
        script:
          - git fetch origin ${BITBUCKET_PR_DESTINATION_BRANCH}
          - .ci/check_changelog.sh origin/${BITBUCKET_PR_DESTINATION_BRANCH}

    - step: &check-release-tag-version
        name: Check release tag matches POLARFS_VERSION
        image: atlassian/default-image:3
        size: 1x
        script:
          - .ci/check_release_tag_version.sh

    - step: &build-docker-images-base
        name: Build Docker Images
        image: docker:latest
        size: 2x
        services:
          - docker-large
        caches:
          - docker
        variables:
          DOCKER_REGISTRY: ghcr.io/awide-labs
        script:
          - apk add --no-cache git
          - |
            export DOCKER_REGISTRY="${DOCKER_REGISTRY:-ghcr.io/awide-labs}"
            if [ -z "$API_TOKEN" ] || [ -z "$DOCKER_USER" ]; then
              echo "Error: API_TOKEN and DOCKER_USER must be set to push images"
              exit 1
            fi
            DOCKER_LOGIN_HOST="${DOCKER_REGISTRY%%/*}"
            echo "$API_TOKEN" | docker login "$DOCKER_LOGIN_HOST" --username "$DOCKER_USER" --password-stdin
            # Iterate through all Dockerfile.* files in docker/builder/
            for dockerfile in docker/builder/Dockerfile.*; do
              [ -f "$dockerfile" ] || continue
              # Image name is the Dockerfile suffix (e.g., Dockerfile.ubuntu:22.04 -> ubuntu:22.04)
              IMAGE_NAME="${dockerfile#docker/builder/Dockerfile.}"
              echo "Building $IMAGE_NAME from $dockerfile"
              DOCKER_BUILDKIT=0 docker build -t "$IMAGE_NAME" -f "$dockerfile" .
              docker tag "$IMAGE_NAME" "${DOCKER_REGISTRY}/pfs-build-${IMAGE_NAME}"
              docker image push "${DOCKER_REGISTRY}/pfs-build-${IMAGE_NAME}"
            done

    - step: &build-docker-images-if-dockerfiles
        <<: *build-docker-images-base
        condition:
          changesets:
            includePaths:
              - "docker/builder/Dockerfile.*"

    - step: &build-docker-images
        <<: *build-docker-images-base

    # Rocky 9 build
    - step: &build-rocky-9
        <<: *step-common
        name: Build (Rocky 9)
        script:
          - export BUILDER_IMAGE="rockylinux:9"
          - *prepare-builder
          - *build-script

    # Rocky 10 build
    - step: &build-rocky-10
        <<: *step-common
        name: Build (Rocky 10)
        script:
          - export BUILDER_IMAGE="rockylinux:10"
          - *prepare-builder
          - *build-script

    # Ubuntu 22.04 build
    - step: &build-ubuntu-22.04
        <<: *step-common
        name: Build (Ubuntu 22.04)
        script:
          - export BUILDER_IMAGE="ubuntu:22.04"
          - *prepare-builder
          - *build-script

    # Ubuntu latest build
    - step: &build-ubuntu-latest
        <<: *step-common
        name: Build (Ubuntu latest)
        script:
          - export BUILDER_IMAGE="ubuntu:latest"
          - *prepare-builder
          - *build-script

    # Ubuntu devel build
    - step: &build-ubuntu-devel
        <<: *step-common
        name: Build (Ubuntu devel)
        script:
          - export BUILDER_IMAGE="ubuntu:devel"
          - *prepare-builder
          - *build-script

    # Rocky 9 package
    - step: &package-rocky-9
        <<: *step-package
        name: Package (Rocky 9)
        script:
          - export BUILDER_IMAGE="rockylinux:9"
          - *prepare-builder
          - *package-script
        artifacts:
          - polarfs*.rpm

    # Rocky 10 package
    - step: &package-rocky-10
        <<: *step-package
        name: Package (Rocky 10)
        script:
          - export BUILDER_IMAGE="rockylinux:10"
          - *prepare-builder
          - *package-script
        artifacts:
          - polarfs*.rpm

    # Ubuntu 22.04 package
    - step: &package-ubuntu-22.04
        <<: *step-package
        name: Package (Ubuntu 22.04)
        script:
          - export BUILDER_IMAGE="ubuntu:22.04"
          - *prepare-builder
          - *package-script
        artifacts:
          - polarfs*.deb

    # Ubuntu latest package
    - step: &package-ubuntu-latest
        <<: *step-package
        name: Package (Ubuntu latest)
        script:
          - export BUILDER_IMAGE="ubuntu:latest"
          - *prepare-builder
          - *package-script
        artifacts:
          - polarfs*.deb

    # Ubuntu devel package
    - step: &package-ubuntu-devel
        <<: *step-package
        name: Package (Ubuntu devel)
        script:
          - export BUILDER_IMAGE="ubuntu:devel"
          - *prepare-builder
          - *package-script
        artifacts:
          - polarfs*.deb

pipelines:
  tags:
    "v*.*.*":
      - step: *check-release-tag-version

  # Non-default branches: Rocky 9 + Ubuntu latest only
  default:
    - parallel:
        - step: *build-rocky-9
        - step: *build-ubuntu-latest

  # Master branch: All images
  branches:
    'master':
      - parallel:
          - step: *build-rocky-9
          - step: *build-rocky-10
          - step: *build-ubuntu-22.04
          - step: *build-ubuntu-latest
          - step: *build-ubuntu-devel

  custom:
    build-docker-images:
      - step: *build-docker-images
    package:
      - parallel:
          - step: *package-rocky-9
          - step: *package-rocky-10
          - step: *package-ubuntu-22.04
          - step: *package-ubuntu-latest
          - step: *package-ubuntu-devel
    full:
      - step: *build-docker-images-if-dockerfiles
      - parallel:
          - step: *build-rocky-9
          - step: *build-rocky-10
          - step: *build-ubuntu-22.04
          - step: *build-ubuntu-latest
          - step: *build-ubuntu-devel
      - parallel:
          - step: *package-rocky-9
          - step: *package-rocky-10
          - step: *package-ubuntu-22.04
          - step: *package-ubuntu-latest
          - step: *package-ubuntu-devel

  # Pull requests: Rocky 9 + Ubuntu latest only
  pull-requests:
    '**':
      - parallel:
          - step: *check-commit-format
          - step: *check-changelog

options:
  docker: true
  max-time: 60
